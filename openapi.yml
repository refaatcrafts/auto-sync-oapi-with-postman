openapi: 3.1.1
info:
  title: Commerce API
  version: 1.0.0
  description: Simple commerce API with products and orders.

servers:
  - url: https://api.example.com

paths:

  /products:
    get:
      summary: List products
      operationId: listProducts
      responses:
        '200':
          description: A list of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

  /products/{productId}:
    get:
      summary: Get a product
      operationId: getProduct
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found

  /orders:
    post:
      summary: Create an order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid order

components:
  schemas:
    Product:
      type: object
      required:
        - id
        - name
        - price
        - currency
      properties:
        id:
          type: string
          example: prod_123
        name:
          type: string
          example: Wireless Headphones
        price:
          type: number
          format: double
          minimum: 0
          example: 99.99
        currency:
          type: string
          example: USD
        inStock:
          type: boolean
          example: true

    CreateOrderRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - productId
              - quantity
            properties:
              productId:
                type: string
                example: prod_123
              quantity:
                type: integer
                minimum: 1
                example: 2

    Order:
      type: object
      required:
        - id
        - items
        - status
        - total
      properties:
        id:
          type: string
          example: order_123
        items:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
              quantity:
                type: integer
        status:
          type: string
          enum:
            - pending
            - paid
            - shipped
            - delivered
            - cancelled
          example: pending
        total:
          type: number
          format: double
          example: 199.98